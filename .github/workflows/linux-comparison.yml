name: Linux compiler comparison
on:
  push:
    branches: [perf/linux-compare]
permissions: {}
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the public benchmark revision
        run: |
          git init project
          git -C project fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C project checkout -q FETCH_HEAD
      - name: Build and compare native implementations
        working-directory: project
        run: bash scripts/compare_linux_compilers.sh
